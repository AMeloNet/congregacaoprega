name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  static-and-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:validate
      - run: pnpm build
      - run: pnpm test:unit

  database:
    name: PostgreSQL and migration fixtures
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: congregacaoprega_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d congregacaoprega_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test_only@127.0.0.1:5432/congregacaoprega_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  browser:
    name: Chromium browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag congregacaoprega:ci .
      - name: Require configuration and serve same-origin assets
        run: |
          if docker run --rm congregacaoprega:ci > missing-config.log 2>&1; then
            echo 'Container unexpectedly started without DATABASE_URL'
            exit 1
          fi
          grep -q 'DATABASE_URL is required' missing-config.log
          docker run --detach --name app --publish 3000:3000 \
            --env DATABASE_URL=postgresql://test:test@127.0.0.1:5432/congregacaoprega_test \
            --env AUTH0_ISSUER=https://identity.example.test/ \
            --env AUTH0_CLIENT_ID=container-test \
            --env AUTH0_CLIENT_SECRET=container-test-secret \
            --env AUTH0_AUDIENCE=https://api.example.test \
            --env AUTH0_CALLBACK_URL=http://127.0.0.1:3000/api/auth/callback \
            --env AUTH0_LOGOUT_URL=http://127.0.0.1:3000/ \
            --env SESSION_SECRET=container-test-session-secret-32-bytes \
            --env BOOTSTRAP_SECRET=container-test-bootstrap-secret \
            --env APP_BASE_URL=http://127.0.0.1:3000 \
            --env EMAIL_TRANSPORT=capture \
            congregacaoprega:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live > live.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' live.json
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'congregacaoprega'
      - if: always()
        run: docker rm --force app || true
